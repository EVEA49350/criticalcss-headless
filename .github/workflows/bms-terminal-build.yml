name: Build EVEA BMS Terminal APK

on:
  push:
    branches:
      - evea-bms-terminal-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bms-terminal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate EVEA launcher icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cat icon_base64_jpg/part00.txt icon_base64_jpg/part01.txt icon_base64_jpg/part02.txt icon_base64_jpg/part03.txt icon_base64_jpg/part04.txt icon_base64_jpg/part05.txt | base64 --decode > app/src/main/res/drawable-nodpi/evea_logo.jpg
          file app/src/main/res/drawable-nodpi/evea_logo.jpg

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EVEA-BMS-Terminal-debug
          path: bms-terminal/app/build/outputs/apk/debug/app-debug.apk
